[package]
name = "aesmyra-gpui"
version = "0.1.0"
edition = "2021"
description = "Aesmyra — Hermes-Client auf GPUI"

[dependencies]
aesmyra-core = { path = "../aesmyra-core" }
gpui = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[[bin]]
name = "aesmyra"
path = "src/main.rs"
