name: Windows-Build

# Baut Aesmyra. auf einem echten Windows-Runner und lädt MSI + NSIS-Setup hoch.
#
# Warum windows-latest und nicht Linux:
#   - MSI wird mit dem WiX Toolset gebaut, das nur unter Windows läuft.
#   - Die Tauri-CLI bietet auf Linux nur [deb, rpm, appimage] als Bundle-Ziele an;
#     "msi" und "nsis" sind dort gar nicht wählbar.
#   - Ein Cross-Build aus Linux wäre nur für NSIS und nur mit Mingw/LLVM möglich
#     und ist von Tauri ausdrücklich als letzter Ausweg gedacht.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  windows-x64:
    name: Windows x64 (MSI + NSIS)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Quellen auschecken
        uses: actions/checkout@v7

      - name: Rust (stable, MSVC) einrichten
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust-Build-Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Cargo.toml im Wurzelverzeichnis ist der Workspace; target/ liegt dort.
          workspaces: "."
          key: windows-x64-msvc

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Tauri-CLI installieren
        # Die npm-CLI ist ein vorgebautes Binary und schneller als
        # `cargo install tauri-cli`, das den Compiler bräuchte.
        run: npm install --global "@tauri-apps/cli@^2"

      - name: Werkzeuge prüfen
        run: |
          rustc --version
          cargo --version
          npm --version
          tauri --version

      - name: MSI und NSIS bauen
        working-directory: crates/aesmyra-app
        # WICHTIG: tauri.conf.json listet unter bundle.targets nur
        # ["deb", "appimage"]. Ohne --bundles würde die CLI unter Windows
        # genau diese Ziele bauen wollen und abbrechen. --bundles ersetzt
        # die Liste vollständig.
        run: tauri build --bundles "msi,nsis" --ci

      - name: Installationsdateien sammeln und prüfen
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $patterns = @(
            'target/release/bundle/msi/*.msi',
            'target/release/bundle/nsis/*-setup.exe'
          )

          foreach ($pattern in $patterns) {
            if (-not (Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue)) {
              Write-Host "Kein Treffer für $pattern. Vorhandene Bundle-Ordner:"
              foreach ($root in @('target', 'crates/aesmyra-app/target')) {
                if (Test-Path $root) {
                  Get-ChildItem -Path $root -Recurse -Depth 2 -Directory -Filter bundle -ErrorAction SilentlyContinue |
                    Select-Object -ExpandProperty FullName
                }
              }
              throw "Erwartete Installationsdatei fehlt: $pattern"
            }
            Copy-Item -Path $pattern -Destination dist
          }

          $files = Get-ChildItem -Path dist -File | Sort-Object Name

          $files | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Path 'dist/SHA256SUMS.txt' -Encoding ascii

          if ($env:GITHUB_STEP_SUMMARY) {
            "### Aesmyra. für Windows" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            $files | ForEach-Object {
              $mb = [math]::Round($_.Length / 1MB, 1)
              "- ``$($_.Name)`` - $mb MB" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            }
          }

          Get-ChildItem -Path dist -File | Select-Object Name, Length | Format-Table -AutoSize

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: aesmyra-windows-x64
          path: dist/*
          if-no-files-found: error
          # MSI und Setup.exe sind bereits komprimiert.
          compression-level: 0
          retention-days: 30
